function prodCard(p){return `<article class="product"><div class="product-img" data-action="go:/product/${p.id}">${image(p)}<span class="tag">DANH MỤC DEMO</span><button aria-label="Yêu thích" class="fav ${state.likes.includes(p.id)?'active':''}" data-action="like:${p.id}">${state.likes.includes(p.id)?'♥':'♡'}</button></div><div class="product-body"><div class="meta">${htmlSafe(CATS[p.categoryIndex][0])}</div><h3 data-action="go:/product/${p.id}">${htmlSafe(p.name)}</h3><div class="meta">Đơn vị nguồn: ${htmlSafe(p.unit)}</div><div class="price">${money(price(p))} <span class="meta" style="font-weight:400">/ giá demo</span></div><div class="product-actions">${btn('Xem chi tiết','go:/product/'+p.id,'btn alt sm')}${btn('＋ Giỏ hàng','add:'+p.id,'btn sm')}</div></div></article>`}
function productsGrid(list){return `<div class="products">${list.map(prodCard).join('')}</div>`}
function home(){return `<div class="container"><div class="hero" style="background-image:url('assets/hero${state.slide+1}.jpg')"><div class="hero-content"><div class="eyebrow">Nguyên liệu chọn lọc • BizGo</div><h1>${['Nguyên liệu nấu chè chất lượng, mua dễ dàng','Mở quán thuận tiện với nguồn nguyên liệu đa dạng','Trân châu & topping cho mọi công thức'][state.slide]}</h1><p>${['Khám phá nguyên liệu, chọn đúng quy cách và gửi yêu cầu mua hàng trực tiếp từ BizGo.','Từ quán chè đến tiệm đồ uống: bảng giá sỉ, yêu cầu báo giá và mua lại nhanh.','Tìm kiếm theo từng nhóm sản phẩm, xem ảnh, yêu thích và quản lý đơn tập trung.'][state.slide]}</p>${btn('Khám phá sản phẩm  →','go:/catalog')} ${btn('Mua sỉ B2B','go:/wholesale','btn alt')}</div><div class="hero-dots">${[0,1,2].map(x=>`<button aria-label="Banner ${x+1}" class="${x===state.slide?'on':''}" data-action="slide:${x}"></button>`).join('')}</div></div><div class="benefits">${[['🚚','Vận chuyển linh hoạt','Theo vùng và loại bảo quản'],['🏭','Nguồn hàng từ xưởng','Quy trình rõ ràng, minh bạch'],['🧋','Nguyên liệu đa dạng','8 nhóm hàng theo danh mục'],['🤝','Hỗ trợ khách sỉ','Đăng ký và yêu cầu báo giá']].map(b=>`<div class="benefit"><span class="emoji">${b[0]}</span><div><strong>${b[1]}</strong><small>${b[2]}</small></div></div>`).join('')}</div><section class="section"><div class="section-head"><div><h2>Danh mục nổi bật</h2><p>Khám phá nguyên liệu theo nhu cầu của bạn</p></div>${link('Xem tất cả →','/catalog')}</div><div class="cats">${CATS.map((c,i)=>`<button class="cat" data-action="go:/catalog?cat=${i}"><span class="symbol">${c[1]}</span><span><strong>${c[0]}</strong><small>${PRODUCTS.filter(p=>p.categoryIndex===i).length} mặt hàng</small></span></button>`).join('')}</div></section><section class="section"><div class="section-head"><div><h2>Sản phẩm được quan tâm</h2><p>Hình minh họa AI, giá chỉ phục vụ thử giao diện</p></div>${link('Tất cả sản phẩm →','/catalog')}</div>${productsGrid([57,60,44,46,31,34,39,81].map(product).filter(Boolean))}</section><div class="promo"><div><h2>BizGo dành cho quán & đại lý</h2><p>Đăng ký nhu cầu nhập sỉ, nhận báo giá theo số lượng và điều kiện giao hàng.</p></div>${btn('Tìm hiểu mua sỉ →','go:/wholesale','btn alt')}</div><section class="section"><div class="section-head"><div><h2>Gợi ý thêm cho bạn</h2><p>Mỗi mặt hàng có thể có nhiều quy cách SKU sau khi xác minh</p></div>${link('Xem thêm →','/catalog')}</div>${productsGrid([1,6,11,14,42,50,71,72].map(product).filter(Boolean))}</section></div>`}
function parseCat(){let m=state.route.match(/cat=(\d+)/);return m?Number(m[1]):-1}
function catalog(){let c=parseCat();let q=(new URLSearchParams(state.route.split('?')[1]||'')).get('q')||'';let arr=PRODUCTS.filter(p=>(c<0||p.categoryIndex===c)&&(!q||(' '+p.name+' '+p.category).toLowerCase().includes(q.toLowerCase()))&&!['Cước','Bao bưởi'].includes(p.name));if(state.sort==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'vi'));if(state.sort==='price')arr.sort((a,b)=>price(a)-price(b));return `<div class="container">${crumb([c<0?'Tất cả sản phẩm':CATS[c][0]])}<h1 class="page-title">${q?'Kết quả tìm kiếm: '+htmlSafe(q):c<0?'Tất cả nguyên liệu BizGo':CATS[c][0]}</h1><p class="sub">82 mặt hàng trong danh mục nguồn. Giá demo minh họa; sản phẩm chưa được xác minh SKU và chưa kích hoạt bán thật.</p><div class="mobile-filter"><select class="input" data-change="cat"> <option value="-1">Tất cả danh mục</option>${CATS.map((x,i)=>`<option value="${i}" ${i===c?'selected':''}>${x[0]}</option>`).join('')}</select></div><div class="shop-layout"><aside class="sidebar"><h4>Danh mục sản phẩm</h4><button class="${c===-1?'sel':''}" data-action="go:/catalog">Tất cả nguyên liệu</button>${CATS.map((x,i)=>`<button class="${c===i?'sel':''}" data-action="go:/catalog?cat=${i}">${x[1]} ${x[0]}</button>`).join('')}<hr><h4>Trạng thái bán hàng</h4><p class="copy">Danh mục gốc chỉ có tên và đơn vị. SKU cần giá thật, tồn, NSX/HSD, bảo quản và hồ sơ pháp lý trước khi mở bán.</p></aside><div><div class="list-top"><span class="sub">Hiển thị <b>${arr.length}</b> mặt hàng</span><select aria-label="Sắp xếp" data-change="sort"><option value="default">Mặc định</option><option ${state.sort==='name'?'selected':''} value="name">Tên A–Z</option><option ${state.sort==='price'?'selected':''} value="price">Giá demo thấp trước</option></select></div>${arr.length?productsGrid(arr):empty('Không tìm thấy sản phẩm','Thử tìm bằng tên khác hoặc bỏ bộ lọc.')}</div></div></div>`}
function detail(id){let p=product(id);if(!p)return info('Không tìm thấy sản phẩm','/catalog');let similar=PRODUCTS.filter(x=>x.categoryIndex===p.categoryIndex&&x.id!==p.id).slice(0,4);return `<div class="container">${crumb([link(CATS[p.categoryIndex][0],'/catalog?cat='+p.categoryIndex),htmlSafe(p.name)])}<div class="detail"><div><div class="detail-photo">${image(p)}</div><div class="notice" style="margin-top:15px">Ảnh đại diện được tạo bằng AI để mô phỏng UI, cần thay ảnh thật trước khi bán.</div></div><div><span class="status">Danh mục mẫu · Chưa mở bán chính thức</span><h1>${htmlSafe(p.name)}</h1><p class="sub">Mã tham chiếu danh mục: BIZ-${String(p.id).padStart(3,'0')} · Nhóm: ${CATS[p.categoryIndex][0]}</p><div class="price" style="font-size:27px;margin:20px 0">${money(price(p))} <small style="font-size:11px;color:#87998a">/ giá minh họa</small></div><div class="spec"><b>Đơn vị ghi trong tài liệu</b><p class="sub">${htmlSafe(p.unit)}</p><b>Chọn quy cách để xem thử UI</b><div>${p.unit.split('/').map(u=>`<button data-action="variant:${htmlSafe(u.trim())}" class="${state.variant===u.trim()?'chosen':''}">${htmlSafe(u.trim())}</button>`).join('')}</div><p class="sub">Quy cách bán thực tế, khối lượng quy đổi, tồn kho và giá theo SKU chưa có dữ liệu để xác nhận.</p></div><div class="actions"><span>SL thử:</span><span class="qty"><button data-action="qty:-1">−</button><span>${state.qty}</span><button data-action="qty:1">＋</button></span></div><div class="actions">${btn('🛒 Thêm vào giỏ demo','add:'+p.id)}${btn('Yêu cầu báo giá sỉ','go:/quote?product='+p.id,'btn alt')}${btn(state.likes.includes(p.id)?'♥ Đã thích':'♡ Yêu thích','like:'+p.id,'btn ghost')}</div><div class="notice">⏱ Lưu ý vận chuyển: mặt hàng tươi, cần lạnh hoặc giới hạn khu vực sẽ được kiểm tra theo từng SKU khi triển khai thật.</div><div class="section"><h3>Thông tin sản phẩm</h3><p class="copy">${htmlSafe(p.note||'Nguyên liệu thuộc danh mục BizGo.')} Để mở bán, BizGo cần nhập thêm xuất xứ, nhãn, hạn dùng, bảo quản, giá và tồn kho của sản phẩm thực tế.</p></div></div></div><section class="section"><div class="section-head"><h2>Sản phẩm cùng nhóm</h2>${link('Xem thêm →','/catalog?cat='+p.categoryIndex)}</div>${productsGrid(similar)}</section></div>`}
function empty(title,sub){return `<div class="empty"><div class="glyph">🧺</div><h3>${title}</h3><p>${sub}</p>${btn('Khám phá sản phẩm','go:/catalog')}</div>`}
function cartRows(){return state.cart.map(c=>{let p=product(c.id);return `<tr><td><div style="display:flex;gap:12px;align-items:center"><div style="width:58px;height:58px">${image(p,'mini-item')}</div><div><b>${htmlSafe(p.name)}</b><div class="meta">${htmlSafe(c.variant||'Quy cách cần xác minh')}</div></div></div></td><td>${money(price(p))} <small>demo</small></td><td><span class="qty"><button data-action="cartqty:${p.id}:-1">−</button><span>${c.qty}</span><button data-action="cartqty:${p.id}:1">＋</button></span></td><td><b>${money(price(p)*c.qty)}</b></td><td><button class="btn alt sm" data-action="remove:${p.id}">Xóa</button></td></tr>`}).join('')}
function total(){return state.cart.reduce((s,c)=>s+price(product(c.id))*c.qty,0)}
function cart(){return `<div class="container">${crumb(['Giỏ hàng'])}<h1 class="page-title">Giỏ hàng của bạn <span class="meta">(${state.cart.length} sản phẩm)</span></h1>${state.cart.length?`<div class="layout-2"><div class="panel table-wrap"><table class="table"><thead><tr><th>Sản phẩm</th><th>Giá demo</th><th>Số lượng</th><th>Tạm tính</th><th></th></tr></thead><tbody>${cartRows()}</tbody></table></div><div class="panel"><h3>Tóm tắt đơn demo</h3><div class="sumrow"><span>Tiền hàng minh họa</span><b>${money(total())}</b></div><div class="sumrow"><span>Vận chuyển</span><b>Chưa tính</b></div><div class="sumrow total"><span>Tạm tính</span><b>${money(total())}</b></div><p class="copy">Giá và giao hàng không có hiệu lực thương mại.</p>${btn('Tiếp tục đến thanh toán →','go:/checkout')}<p>${link('← Tiếp tục mua sắm','/catalog')}</p></div></div>`:empty('Giỏ hàng đang trống','Chọn sản phẩm để thử hành trình đặt hàng.')}</div>`}
function checkout(){if(!state.cart.length)return `<div class="container">${crumb(['Thanh toán'])}${empty('Chưa có sản phẩm','Vui lòng chọn mặt hàng trước khi thử thanh toán.')}</div>`;return `<div class="container">${crumb(['Giỏ hàng','Thanh toán'])}<h1 class="page-title">Thanh toán thử nghiệm</h1><p class="sub">Tất cả thông tin chỉ lưu tại trình duyệt. Không gửi đơn thật, không thu tiền và không kết nối đơn vị vận chuyển.</p><form id="checkout-form" class="checkout-box"><div><div class="fieldset"><h3>1. Thông tin nhận hàng</h3><div class="form-grid"><div class="field"><label>Họ và tên *</label><input name="name" required placeholder="Nguyễn Văn A" value="${htmlSafe(state.user)}"></div><div class="field"><label>Số điện thoại *</label><input name="phone" required placeholder="09xxxxxxxx" pattern="[0-9]{9,11}"></div></div><div class="field"><label>Địa chỉ giao hàng *</label><textarea name="address" required placeholder="Số nhà, đường, phường/xã, tỉnh/thành phố"></textarea></div><div class="field"><label>Ghi chú</label><textarea name="note" placeholder="Yêu cầu giao/đóng gói"></textarea></div></div><div class="fieldset"><h3>2. Phương thức giao hàng</h3><label class="radio-line"><input type="radio" name="shipping" checked value="verify"> Kiểm tra tuyến giao và phí sau xác nhận (demo)</label><p class="copy">Hàng tươi/lạnh hoặc đơn lớn có thể cần cước và điều kiện giao riêng.</p></div><div class="fieldset"><h3>3. Phương thức thanh toán</h3><label class="radio-line"><input type="radio" name="pay" checked value="COD"> COD – Thanh toán khi nhận hàng (mô phỏng)</label><label class="radio-line"><input type="radio" name="pay" value="BANK"> Chuyển khoản – cần xác nhận thủ công (mô phỏng)</label></div></div><div class="panel"><h3>Đơn hàng demo</h3>${state.cart.map(c=>`<div class="sumrow"><span>${htmlSafe(product(c.id).name)} × ${c.qty}</span><b>${money(price(product(c.id))*c.qty)}</b></div>`).join('')}<div class="sumrow"><span>Vận chuyển</span><b>Chưa xác định</b></div><div class="sumrow total"><span>Tạm tính</span><b>${money(total())}</b></div><p class="copy">Giá hiển thị chỉ để kiểm thử. Đơn demo không được gửi tới BizGo.</p><button class="btn" type="submit" style="width:100%">Tạo đơn demo →</button></div></form></div>`}
function success(){let o=state.orders[0];return `<div class="container" style="max-width:730px;padding-top:45px;text-align:center"><div style="font-size:65px">✅</div><h1>Đã tạo đơn hàng demo!</h1><p class="sub">Mã đơn: <strong>${htmlSafe(o?.code||'BG-DEMO')}</strong>. Đây là hành trình mô phỏng, không có giao dịch hoặc vận chuyển thật.</p><div class="steps"><div class="step">Tiếp nhận</div><div class="step off">Xác nhận</div><div class="step off">Đóng gói</div><div class="step off">Giao hàng</div></div>${btn('Xem lịch sử đơn demo','go:/orders')} ${btn('Về trang chủ','go:/','btn alt')}</div>`}
function orders(){return `<div class="container">${crumb(['Đơn hàng'])}<h1 class="page-title">Đơn hàng của tôi</h1>${state.orders.length?`<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Mã đơn</th><th>Ngày tạo</th><th>Số sản phẩm</th><th>Tổng demo</th><th>Trạng thái</th><th></th></tr></thead><tbody>${state.orders.map(o=>`<tr><td><b>${o.code}</b></td><td>${o.date}</td><td>${o.items.reduce((s,c)=>s+c.qty,0)}</td><td>${money(o.total)}</td><td><span class="status">Đơn mô phỏng</span></td><td>${btn('Chi tiết','go:/order/'+o.code,'btn alt sm')}</td></tr>`).join('')}</tbody></table></div></div>`:empty('Chưa có đơn hàng demo','Hãy trải nghiệm luồng giỏ hàng và checkout.')}</div>`}
function orderDetail(code){let o=state.orders.find(x=>x.code===code);if(!o)return info('Không tìm thấy đơn','/orders');return `<div class="container">${crumb([link('Đơn hàng','/orders'),code])}<h1 class="page-title">Đơn hàng ${code}</h1><div class="notice">Đây là đơn tạo trong trình duyệt để thử giao diện, không kết nối server.</div><div class="steps"><div class="step">● Tiếp nhận</div><div class="step off">◌ Xác nhận</div><div class="step off">◌ Đóng gói</div><div class="step off">◌ Giao hàng</div></div><div class="layout-2"><div class="panel"><h3>Sản phẩm</h3>${o.items.map(c=>`<div class="sumrow"><span>${htmlSafe(product(c.id).name)} × ${c.qty}</span><b>${money(price(product(c.id))*c.qty)}</b></div>`).join('')}<h3>Người nhận</h3><p class="copy">${htmlSafe(o.name)} · ${htmlSafe(o.phone)}<br>${htmlSafe(o.address)}</p></div><div class="panel"><h3>Thông tin đơn</h3><div class="sumrow"><span>Phương thức</span><b>${o.pay}</b></div><div class="sumrow"><span>Trạng thái</span><b>Đơn demo</b></div><div class="sumrow total"><span>Tạm tính</span><b>${money(o.total)}</b></div>${btn('Yêu cầu hỗ trợ','go:/support','btn alt')}</div></div></div>`}
function auth(type){let signup=type==='register',forgot=type==='forgot',reset=type==='reset',otp=type==='otp';return `<div class="container"><div class="auth"><div class="brand" style="text-align:center;margin-bottom:25px"><b>Biz</b><i>Go</i></div><h1>${signup?'Tạo tài khoản':forgot?'Quên mật khẩu':reset?'Đặt lại mật khẩu':otp?'Xác thực OTP':'Chào mừng trở lại'}</h1><p>${signup?'Đăng ký để quản lý địa chỉ, đơn hàng và yêu thích':forgot?'Nhập email hoặc số điện thoại đã đăng ký':reset?'Đặt mật khẩu mới cho tài khoản':otp?'Nhập mã OTP demo để tiếp tục':'Đăng nhập để theo dõi đơn hàng BizGo'}</p><form id="auth-form" data-type="${type}">${signup?`<div class="field"><label>Họ và tên</label><input required name="name" placeholder="Tên của bạn"></div>`:''}${!reset&&!otp?`<div class="field"><label>Email hoặc số điện thoại</label><input required name="identity" placeholder="Nhập email hoặc số điện thoại"></div>`:''}${!forgot&&!otp?`<div class="field"><label>${reset?'Mật khẩu mới':'Mật khẩu'}</label><input required type="password" name="password" minlength="6" placeholder="Tối thiểu 6 ký tự"></div>`:''}${otp?`<div class="field"><label>Mã OTP thử nghiệm</label><input name="otp" placeholder="123456" required pattern="[0-9]{6}"></div>`:''}<button class="btn" type="submit">${signup?'Đăng ký demo':forgot?'Tiếp tục':reset?'Cập nhật thử':otp?'Xác thực thử':'Đăng nhập demo'}</button></form><div class="switch">${signup?link('Đã có tài khoản? Đăng nhập','/login'):forgot?link('Quay lại đăng nhập','/login'):otp?'Mã demo: 123456':reset?link('Quay lại đăng nhập','/login'):`${link('Quên mật khẩu?','/forgot')} · ${link('Đăng ký tài khoản','/register')}`}</div><div class="notice" style="margin-top:20px">Chức năng xác thực chỉ là bản mô phỏng, không gửi OTP thật và không lưu mật khẩu.</div></div></div>`}
function accountNav(active){return `<aside class="sidebar"><div class="account-nav">${[['account','Tổng quan'],['profile','Thông tin cá nhân'],['addresses','Sổ địa chỉ'],['orders','Đơn hàng của tôi'],['likes','Yêu thích'],['notifications','Thông báo'],['security','Đổi mật khẩu'],['wholesale','Mua sỉ B2B']].map(x=>`<button class="${active===x[0]?'selected':''}" data-action="go:/${x[0]}">${x[1]}</button>`).join('')}<button data-action="logout">Đăng xuất</button></div></aside>`}
function accWrap(active,title,inner){return `<div class="container">${crumb(['Tài khoản'])}<h1 class="page-title">${title}</h1><div class="account-shell">${accountNav(active)}<div>${inner}</div></div></div>`}
function account(){return accWrap('account','Tài khoản BizGo',`<div class="page-banner"><div class="eyebrow">Xin chào</div><h2>${htmlSafe(state.user||'Khách hàng BizGo')} 👋</h2><p class="sub">Quản lý thông tin cá nhân, mua sắm và yêu cầu dành cho đại lý tại đây.</p></div><div class="smallcards" style="margin-top:16px">${[['📦','Đơn hàng',state.orders.length,'/orders'],['♡','Đã thích',state.likes.length,'/likes'],['📍','Địa chỉ',state.address.length,'/addresses']].map(x=>`<button class="smallcard" data-action="go:${x[3]}" style="text-align:left;background:#fff"><div style="font-size:26px">${x[0]}</div><h3>${x[1]}</h3><b>${x[2]}</b></button>`).join('')}</div><div class="notice" style="margin-top:18px">Tài khoản và đơn hàng đang ở chế độ demo lưu trong trình duyệt.</div>`)}
function profile(){return accWrap('profile','Thông tin cá nhân',`<form class="panel" id="profile-form"><h3>Hồ sơ của bạn</h3><div class="field"><label>Họ tên</label><input name="name" required value="${htmlSafe(state.user)}"></div><div class="field"><label>Email</label><input name="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Số điện thoại</label><input name="phone" placeholder="09xxxxxxxx"></div><button class="btn">Lưu hồ sơ demo</button></form>`)}
function addresses(){return accWrap('addresses','Sổ địa chỉ',`<div class="panel"><h3>Địa chỉ đã lưu</h3>${state.address.length?state.address.map((a,i)=>`<div class="sumrow"><span><b>${htmlSafe(a.name)}</b><br>${htmlSafe(a.line)}</span>${btn('Xóa','deleteaddress:'+i,'btn alt sm')}</div>`).join(''):'<p class="sub">Chưa có địa chỉ nào.</p>'}${btn('＋ Thêm địa chỉ','modal:address','btn sm')}</div>`)}
function likes(){let arr=state.likes.map(product).filter(Boolean);return accWrap('likes','Sản phẩm yêu thích',arr.length?productsGrid(arr):empty('Chưa có sản phẩm yêu thích','Nhấn ♡ trên thẻ sản phẩm để lưu.'))}
function notifications(){return accWrap('notifications','Thông báo',`<div class="panel"><h3>Trung tâm thông báo</h3><div class="sumrow"><span>🌱 Chào mừng đến với bản demo BizGo</span><span class="status">Mới</span></div><div class="sumrow"><span>📦 Các đơn được tạo sẽ xuất hiện trong lịch sử demo</span><span class="meta">Hướng dẫn</span></div></div>`)}
function security(){return accWrap('security','Đổi mật khẩu',`<div class="panel"><h3>Bảo mật tài khoản</h3><p class="copy">Đăng nhập trong bản demo là mô phỏng, không ghi nhớ mật khẩu. Chức năng đổi mật khẩu sẽ được kết nối Auth API khi triển khai thực tế.</p>${btn('Xem màn đặt lại mật khẩu','go:/reset','btn alt')}</div>`)}
function wholesale(){return `<div class="container">${crumb(['Mua sỉ B2B'])}<div class="page-banner" style="padding:45px"><div class="eyebrow">BizGo wholesale</div><h1 class="page-title">Nguồn nguyên liệu cho quán & đại lý</h1><p class="sub">Đăng ký hồ sơ kinh doanh, đợi xác minh và nhận giá cấp theo tài khoản. Báo giá số lượng lớn được xét duyệt riêng.</p>${btn('Đăng ký khách sỉ','go:/wholesale/register')} ${btn('Gửi yêu cầu báo giá','go:/quote','btn alt')}</div><section class="section"><div class="smallcards">${[['🏪','Đăng ký đại lý','Hồ sơ cơ sở, mặt hàng và nhu cầu'],['📝','Yêu cầu báo giá','Bảng giá theo lượng đặt, vùng giao và điều kiện'],['🔁','Mua lại đơn cũ','Đặt nhanh sau khi tài khoản được duyệt']].map(x=>`<div class="smallcard"><div style="font-size:30px">${x[0]}</div><h3>${x[1]}</h3><p class="copy">${x[2]}</p></div>`).join('')}</div></section><section class="section"><div class="section-head"><h2>Quy trình dành cho khách sỉ</h2></div><div class="steps"><div class="step">1. Gửi hồ sơ</div><div class="step">2. BizGo duyệt</div><div class="step">3. Nhận báo giá</div><div class="step">4. Tạo đơn sỉ</div></div></section></div>`}
function wholesaleRegister(){return `<div class="container">${crumb([link('Mua sỉ B2B','/wholesale'),'Đăng ký'])}<h1 class="page-title">Đăng ký tài khoản đại lý</h1><div class="layout-2"><form class="panel" id="wholesale-form"><div class="form-grid"><div class="field"><label>Tên cửa hàng *</label><input required name="store"></div><div class="field"><label>Người liên hệ *</label><input required name="name"></div><div class="field"><label>Số điện thoại *</label><input required name="phone"></div><div class="field"><label>Mã số thuế (nếu có)</label><input name="tax"></div></div><div class="field"><label>Khu vực giao hàng</label><input name="region" placeholder="Tỉnh/thành phố"></div><div class="field"><label>Nhu cầu nguyên liệu</label><textarea name="need" placeholder="Ví dụ: 50kg trân châu / tháng"></textarea></div><button class="btn">Gửi hồ sơ demo</button></form><div class="panel"><h3>Quyền lợi khi được duyệt</h3><p class="copy">✅ Xem bảng giá theo cấp khách được duyệt</p><p class="copy">✅ Báo giá số lượng lớn và MOQ</p><p class="copy">✅ Theo dõi báo giá và đơn mua lại</p><div class="notice">Giá đại lý chỉ được xem sau khi xét duyệt thật. Bản demo không hiển thị bảng giá tier nhạy cảm.</div></div></div></div>`}
function wholesaleStatus(){return `<div class="container">${crumb(['Khách sỉ'])}<div class="auth" style="text-align:center"><div style="font-size:53px">🕒</div><h1>Hồ sơ demo đã ghi nhận</h1><p>Trạng thái: Chờ xét duyệt (mô phỏng). Không có hồ sơ thực tế được gửi.</p>${btn('Xem yêu cầu báo giá','go:/quote')} ${btn('Trang chủ','go:/','btn alt')}</div></div>`}
function quote(){let pre=(new URLSearchParams(state.route.split('?')[1]||'')).get('product');return `<div class="container">${crumb(['Yêu cầu báo giá'])}<h1 class="page-title">Yêu cầu báo giá sỉ</h1><p class="sub">Vui lòng nhập mặt hàng, số lượng và khu vực nhận để BizGo có thể xét báo giá khi hệ thống hoạt động thực tế.</p><div class="layout-2"><form class="panel" id="quote-form"><div class="form-grid"><div class="field"><label>Tên người liên hệ *</label><input name="name" required></div><div class="field"><label>Số điện thoại *</label><input name="phone" required></div></div><div class="field"><label>Sản phẩm</label><select name="product">${PRODUCTS.filter(p=>!['Cước','Bao bưởi'].includes(p.name)).map(p=>`<option value="${p.id}" ${Number(pre)===p.id?'selected':''}>${htmlSafe(p.name)}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>Số lượng dự kiến</label><input name="qty" placeholder="Ví dụ: 20"></div><div class="field"><label>Đơn vị</label><select name="unit"><option>Kg</option><option>Thùng</option><option>Túi</option><option>Bao</option><option>Set</option></select></div></div><div class="field"><label>Khu vực nhận</label><input name="address"></div><div class="field"><label>Yêu cầu khác</label><textarea name="note"></textarea></div><button class="btn">Gửi yêu cầu demo</button></form><div class="panel"><h3>Quy trình báo giá</h3><p class="copy">1. Khách gửi nhu cầu<br>2. BizGo kiểm tra tồn, MOQ và vùng giao<br>3. Sale gửi báo giá có hiệu lực<br>4. Khách chốt báo giá và đặt hàng</p><div class="notice">Dữ liệu nhập ở đây không gửi đi và không phát sinh báo giá thật.</div></div></div></div>`}
function contact(){return `<div class="container">${crumb(['Liên hệ'])}<h1 class="page-title">Liên hệ với BizGo</h1><div class="layout-2"><form class="panel" id="contact-form"><h3>Gửi lời nhắn</h3><div class="field"><label>Họ tên *</label><input name="name" required></div><div class="field"><label>Email hoặc số điện thoại *</label><input name="contact" required></div><div class="field"><label>Nội dung *</label><textarea name="message" required></textarea></div><button class="btn">Gửi lời nhắn demo</button></form><div class="panel"><h3>Hỗ trợ</h3><p class="copy">Kênh liên hệ, hotline, địa chỉ xưởng và thời gian hỗ trợ sẽ được cập nhật khi BizGo chốt thông tin vận hành.</p><div class="notice">Chưa có số điện thoại hay địa chỉ được xác minh trong tài liệu.</div></div></div></div>`}
function support(){return `<div class="container">${crumb(['Trung tâm hỗ trợ'])}<h1 class="page-title">BizGo hỗ trợ bạn</h1><div class="smallcards"><div class="smallcard"><h3>📦 Theo dõi đơn</h3><p class="copy">Tra cứu đơn hàng và trạng thái giao</p>${btn('Tra cứu','go:/track','btn alt sm')}</div><div class="smallcard"><h3>↩️ Đổi trả & khiếu nại</h3><p class="copy">Gửi mã đơn, hình ảnh và lý do yêu cầu</p>${btn('Tạo yêu cầu','go:/return','btn alt sm')}</div><div class="smallcard"><h3>💬 Liên hệ BizGo</h3><p class="copy">Gửi thắc mắc và nhu cầu tư vấn</p>${btn('Liên hệ','go:/contact','btn alt sm')}</div></div><section class="section"><h2>Câu hỏi thường gặp</h2><div class="panel"><details><summary>BizGo có bán cho quán và đại lý?</summary><p class="copy">Có luồng B2B đăng ký và yêu cầu báo giá. Giá được cấp sau xét duyệt.</p></details><hr><details><summary>Nguyên liệu cần lạnh có giao toàn quốc?</summary><p class="copy">Cần xác nhận theo SKU, hãng vận chuyển và vùng hỗ trợ; chưa mặc định giao được mọi nơi.</p></details><hr><details><summary>Có thể mua hàng ngay không?</summary><p class="copy">Bản này là demo. Chỉ những SKU đủ hồ sơ, giá và tồn mới được mở bán thực tế.</p></details></div></section></div>`}
function track(){return `<div class="container">${crumb(['Tra cứu đơn'])}<div class="auth"><h1>Tra cứu đơn hàng</h1><p>Nhập mã đơn demo đã tạo để xem chi tiết.</p><form id="track-form"><div class="field"><label>Mã đơn</label><input name="code" placeholder="BG-DEMO-..."></div><button class="btn">Tra cứu</button></form></div></div>`}
function returns(){return `<div class="container">${crumb(['Đổi trả'])}<h1 class="page-title">Yêu cầu đổi trả / khiếu nại</h1><div class="layout-2"><form class="panel" id="return-form"><div class="field"><label>Mã đơn *</label><input required name="code"></div><div class="field"><label>Lý do *</label><select name="reason"><option>Nhận sai sản phẩm</option><option>Hư hỏng khi vận chuyển</option><option>Chất lượng không phù hợp</option><option>Khác</option></select></div><div class="field"><label>Mô tả và bằng chứng</label><textarea name="note" placeholder="Mô tả tình trạng, mã lô và hình ảnh (chức năng tải ảnh kết nối sau)"></textarea></div><button class="btn">Tạo yêu cầu demo</button></form><div class="panel"><h3>Quy trình xử lý</h3><p class="copy">BizGo/CSKH tiếp nhận, xác minh ảnh – mã lô – điều kiện bảo quản, sau đó thông báo phương án theo chính sách.</p><div class="notice">Bản demo không tải ảnh hoặc tạo phiếu xử lý thật.</div></div></div></div>`}
function guides(){return `<div class="container">${crumb(['Cẩm nang'])}<h1 class="page-title">Cẩm nang nguyên liệu BizGo</h1><p class="sub">Những bài viết minh họa cho phân hệ nội dung/CMS.</p><div class="smallcards">${[['🍡','Gợi ý chuẩn bị topping cho quán chè','Nhóm trân châu, hạt lựu, thạch và khoai dẻo.'],['🥥','Lưu ý bảo quản nước cốt dừa','Cần tuân theo hướng dẫn của từng SKU thực tế.'],['🌿','Phân biệt các loại cốm và hạt sen','Cách tổ chức danh mục dễ tìm kiếm.']].map(x=>`<div class="smallcard"><div style="font-size:40px">${x[0]}</div><h3>${x[1]}</h3><p class="copy">${x[2]}</p>${btn('Xem bài mẫu','go:/guide/'+encodeURIComponent(x[1]),'btn alt sm')}</div>`).join('')}</div></div>`}
function guide(t){return `<div class="container">${crumb([link('Cẩm nang','/guides'),htmlSafe(decodeURIComponent(t))])}<div class="panel" style="max-width:800px;margin:auto"><h1>${htmlSafe(decodeURIComponent(t))}</h1><p class="copy">Đây là nội dung placeholder cho màn bài viết. BizGo có thể cập nhật bài viết chính thức qua CMS, gồm ảnh, công thức, phân loại hàng và CTA đến nhóm sản phẩm.</p>${btn('Xem nguyên liệu','go:/catalog')}</div></div>`}
function policy(kind){let names={shipping:'Chính sách giao hàng',returns:'Chính sách đổi trả',privacy:'Chính sách bảo mật',terms:'Điều khoản mua hàng'};return `<div class="container">${crumb(['Chính sách'])}<h1 class="page-title">${names[kind]||'Chính sách BizGo'}</h1><div class="panel" style="max-width:850px"><div class="notice">Nội dung chính sách này chưa được duyệt. Cần bổ sung điều kiện chính thức và thông tin chủ thể bán trước khi công bố.</div><h3>Nguyên tắc dự kiến</h3><p class="copy">${kind==='shipping'?'Phí và thời gian giao hàng xác định theo địa chỉ, cân nặng, nhiệt độ bảo quản và đơn vị vận chuyển đủ điều kiện.':kind==='returns'?'Yêu cầu cần mã đơn, thời điểm nhận, ảnh và mô tả sự cố. BizGo phối hợp xưởng xác minh trước khi chốt phương án.':kind==='privacy'?'Chỉ thu thập và xử lý dữ liệu phục vụ các mục đích đã thông báo. Cần triển khai quyền truy cập, sửa, xóa dữ liệu và biện pháp bảo mật theo quy định.':'Giá, hàng hóa, thanh toán, đổi trả và quyền của các bên phải được công bố rõ khi vận hành thật.'}</p>${btn('Liên hệ BizGo','go:/contact','btn alt')}</div></div>`}
function about(){return `<div class="container">${crumb(['Giới thiệu'])}<div class="page-banner"><h1 class="page-title">BizGo – nguyên liệu nấu chè & đồ ăn vặt</h1><p class="sub">BizGo bán hàng trực tiếp, phối hợp xưởng đối tác thực hiện đơn. Không mở gian hàng nhiều nhà bán bên ngoài. Giao diện này là bản thiết kế để chốt luồng web responsive.</p></div><div class="section smallcards"><div class="smallcard"><h3>8 nhóm hàng</h3><p class="copy">Theo danh mục nguyên liệu nguồn</p></div><div class="smallcard"><h3>B2C và B2B</h3><p class="copy">Mua lẻ, mua sỉ và báo giá theo cấp</p></div><div class="smallcard"><h3>Vận hành rõ vai trò</h3><p class="copy">BizGo quản lý bán hàng, xưởng đóng gói</p></div></div></div>`}
function info(t,r){return `<div class="container">${empty(t,'Trang này không có dữ liệu trong bản demo.')}${btn('Quay lại',`go:${r}`)}</div>`}
function modal(){if(!state.modal)return '';return `<div class="modal-bg" data-action="modalclose"><div class="modal" onclick="event.stopPropagation()"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${state.modal==='address'?'Thêm địa chỉ':'Thông báo'}</h2><button class="btn alt sm" data-action="modalclose">✕</button></div>${state.modal==='address'?`<form id="address-form"><div class="field"><label>Tên người nhận</label><input name="name" required></div><div class="field"><label>Địa chỉ</label><textarea name="line" required></textarea></div><button class="btn">Lưu địa chỉ demo</button></form>`:'<p class="copy">Đây là hộp thoại minh họa.</p>'}</div></div>`}
function mainPage(){let r=state.route.split('?')[0];if(r==='/')return home();if(r==='/catalog')return catalog();if(r.startsWith('/product/'))return detail(r.split('/')[2]);if(r==='/cart')return cart();if(r==='/checkout')return checkout();if(r==='/success')return success();if(r==='/orders')return orders();if(r.startsWith('/order/'))return orderDetail(r.split('/')[2]);if(['/login','/register','/forgot','/reset','/otp'].includes(r))return auth(r.slice(1));if(r==='/account')return account();if(r==='/profile')return profile();if(r==='/addresses')return addresses();if(r==='/likes')return likes();if(r==='/notifications')return notifications();if(r==='/security')return security();if(r==='/wholesale')return wholesale();if(r==='/wholesale/register')return wholesaleRegister();if(r==='/wholesale/status')return wholesaleStatus();if(r==='/quote')return quote();if(r==='/support')return support();if(r==='/contact')return contact();if(r==='/track')return track();if(r==='/return')return returns();if(r==='/guides')return guides();if(r.startsWith('/guide/'))return guide(r.slice(7));if(r.startsWith('/policy/'))return policy(r.split('/')[2]);if(r==='/about')return about();return info('Không tìm thấy trang','/')}
function render(){document.getElementById('root').innerHTML=nav()+`<main class="main">${mainPage()}</main>`+footer()+modal();document.title='BizGo • '+(state.route==='/'?'Trang chủ':state.route.replace('/',''))}
function add(id){let p=product(id);if(!p)return;let existing=state.cart.find(x=>x.id===p.id);if(existing)existing.qty+=state.qty;else state.cart.push({id:p.id,qty:state.qty,variant:state.variant});save();toast('Đã thêm '+p.name+' vào giỏ demo');render()}
function clickAction(x){let [act,...rest]=x.split(':');let v=rest.join(':');if(act==='go')go(v);else if(act==='slide'){state.slide=Number(v);render()}else if(act==='add')add(v);else if(act==='like'){let id=Number(v);state.likes=state.likes.includes(id)?state.likes.filter(x=>x!==id):[...state.likes,id];save();render()}else if(act==='qty'){state.qty=Math.max(1,state.qty+Number(v));render()}else if(act==='variant'){state.variant=v;render()}else if(act==='cartqty'){let[id,d]=v.split(':').map(Number);let c=state.cart.find(c=>c.id===id);if(c){c.qty+=d;if(c.qty<=0)state.cart=state.cart.filter(c=>c.id!==id)}save();render()}else if(act==='remove'){state.cart=state.cart.filter(c=>c.id!==Number(v));save();render()}else if(act==='logout'){state.user='';localStorage.removeItem('bizgo-user');go('/login');toast('Đã đăng xuất demo')}else if(act==='modal'){state.modal=v;render()}else if(act==='modalclose'){state.modal='';render()}else if(act==='deleteaddress'){state.address.splice(Number(v),1);save();render()}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(el){if(el.matches('button'))e.preventDefault();clickAction(el.dataset.action)}});document.addEventListener('change',e=>{if(e.target.dataset.change==='sort'){state.sort=e.target.value;render()}if(e.target.dataset.change==='cat')go(e.target.value==='-1'?'/catalog':'/catalog?cat='+e.target.value)});
document.addEventListener('submit',e=>{e.preventDefault();let form=e.target,fd=new FormData(form);if(form.id==='searchform'){state.query=form.querySelector('input').value;go('/catalog?q='+encodeURIComponent(state.query));return}if(form.id==='checkout-form'){let o={code:'BG-DEMO-'+String(Date.now()).slice(-7),date:new Date().toLocaleString('vi-VN'),name:fd.get('name'),phone:fd.get('phone'),address:fd.get('address'),pay:fd.get('pay'),total:total(),items:structuredClone(state.cart)};state.orders.unshift(o);state.cart=[];save();go('/success');return}if(form.id==='auth-form'){let kind=form.dataset.type;if(kind==='forgot')go('/otp');else if(kind==='otp'){if(fd.get('otp')!=='123456')toast('Mã OTP demo là 123456');else go('/reset')}else if(kind==='reset'){toast('Đã mô phỏng đặt lại mật khẩu');go('/login')}else{state.user=String(fd.get('name')||fd.get('identity')||'Khách BizGo').split('@')[0];localStorage.setItem('bizgo-user',state.user);go('/account');toast('Đăng nhập demo thành công')}return}if(form.id==='profile-form'){state.user=String(fd.get('name'));localStorage.setItem('bizgo-user',state.user);toast('Đã lưu hồ sơ demo');render();return}if(form.id==='address-form'){state.address.push({name:fd.get('name'),line:fd.get('line')});save();state.modal='';render();toast('Đã lưu địa chỉ demo');return}if(form.id==='wholesale-form'){state.b2b='pending';localStorage.setItem('bizgo-b2b','pending');go('/wholesale/status');return}if(form.id==='track-form'){let code=String(fd.get('code')).trim().toUpperCase();if(state.orders.some(o=>o.code===code))go('/order/'+code);else toast('Không tìm thấy mã đơn demo trên trình duyệt này');return}if(['quote-form','contact-form','return-form'].includes(form.id)){toast('Đã ghi nhận thao tác demo, chưa gửi dữ liệu lên máy chủ');form.reset();return}});
render();</script></body></html>
