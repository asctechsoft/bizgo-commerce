openapi: 3.1.0
info:
  title: BizGo API
  version: 0.1.0-skeleton
  summary: Phase 0 OpenAPI skeleton (contract draft, not generated from code yet)
  description: |
    Draft contract assembled from Master Spec §09, Architecture §05, and docs/ui_route_api_matrix.csv.
    Request/response bodies for most operations are intentionally generic placeholders; they will be replaced by
    NestJS-generated schemas (ADR-0006). `x-phase` = delivery phase; `x-permission` = permission code (PERMISSION_MATRIX.md);
    `x-blocked-by` = BLOCKED_DECISION / feature flag that keeps the feature fail-closed until approved.
    No price, stock, SKU, or fee in examples is real business data.
servers:
  - url: http://localhost:4000
    description: local development
tags:
  - name: Admin Catalog
  - name: Admin Content
  - name: Admin Finance
  - name: Admin Fulfillment
  - name: Admin Inventory
  - name: Admin Orders
  - name: Admin Support
  - name: Admin System
  - name: Admin Users
  - name: Admin Wholesale
  - name: Auth
  - name: Cart
  - name: Catalog
  - name: Checkout
  - name: Content
  - name: Factory
  - name: Files
  - name: Me
  - name: Orders
  - name: Payments
  - name: Pricing
  - name: Returns
  - name: Shipping
  - name: Support
  - name: System
  - name: Webhooks
  - name: Wholesale
