components:
  securitySchemes:
    customerSession: { type: apiKey, in: cookie, name: bg_sid }
    adminSession: { type: apiKey, in: cookie, name: bg_admin_sid }
    factorySession: { type: apiKey, in: cookie, name: bg_factory_sid }
    bearerAuth: { type: http, scheme: bearer }
    webhookSignature: { type: apiKey, in: header, name: X-Signature }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, maxLength: 64 }
  schemas:
    SuccessEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          {
            type: object,
            properties:
              {
                requestId: { type: string },
                page: { type: integer },
                limit: { type: integer },
                total: { type: integer },
              },
          }
    ErrorEnvelope:
      type: object
      required: [code, message, requestId]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: Vietnamese, safe to show }
        details: { type: array, items: { type: object, additionalProperties: true } }
        requestId: { type: string }
    ErrorCode:
      type: string
      enum:
        [
          VALIDATION_ERROR,
          UNAUTHENTICATED,
          FORBIDDEN,
          NOT_FOUND,
          RATE_LIMITED,
          SKU_NOT_READY,
          PRICE_NOT_SET,
          PRICE_CHANGED,
          OUT_OF_STOCK,
          INSUFFICIENT_STOCK,
          INVALID_PACK_CONVERSION,
          DELIVERY_UNSUPPORTED,
          SHIPPING_FEE_UNDETERMINED,
          TAX_POLICY_UNDETERMINED,
          QUOTE_EXPIRED,
          PAYMENT_NOT_VERIFIED,
          UNAUTHORIZED_SCOPE,
          INVALID_STATE_TRANSITION,
          IDEMPOTENCY_CONFLICT,
          IDEMPOTENCY_IN_PROGRESS,
          LOT_EXPIRED,
          OTP_DELIVERY_NOT_CONFIGURED,
          OTP_INVALID,
          OTP_EXPIRED,
          OTP_LOCKED,
          FEATURE_DISABLED,
          MFA_REQUIRED,
          STEP_UP_REQUIRED,
        ]
    OrderStatus:
      type: string
      enum:
        [
          DRAFT,
          PENDING_CONFIRMATION,
          CONFIRMED,
          PACKING,
          READY_TO_SHIP,
          PARTIALLY_SHIPPED,
          SHIPPED,
          DELIVERED,
          COMPLETED,
          ON_HOLD,
          CANCEL_REQUESTED,
          CANCELLED,
          RETURN_REQUESTED,
          RETURNED,
          FAILED,
        ]
    PaymentStatus:
      type: string
      enum:
        [
          PENDING,
          AWAITING_VERIFICATION,
          AUTHORIZED,
          PAID,
          FAILED,
          EXPIRED,
          PARTIALLY_REFUNDED,
          REFUNDED,
        ]
    FulfillmentStatus:
      type: string
      enum:
        [
          QUEUED,
          ACCEPTED,
          STOCK_CONFIRMED,
          PICKING,
          PACKING,
          PACKED,
          READY_FOR_HANDOVER,
          HANDED_OVER,
          BLOCKED,
          PARTIAL,
          REJECTED,
          CANCELLED,
        ]
    ShipmentStatus:
      type: string
      enum:
        [
          DRAFT,
          LABELLED,
          PICKED_UP,
          IN_TRANSIT,
          DELIVERED,
          DELIVERY_FAILED,
          RETURN_TO_SENDER,
          RETURNED,
        ]
    ProductStatus:
      type: string
      enum: [DRAFT, UNDER_REVIEW, ACTIVE, PAUSED, ARCHIVED]
    QuoteBlocker:
      type: object
      required: [code]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        variantId: { type: string, format: uuid }
        message: { type: string }
    CheckoutQuote:
      type: object
      description: Numbers are nullable when undetermined; null means 'not known', never zero.
      required: [quoteId, version, expiresAt, currency, lines, canPlaceOrder, blockers]
      properties:
        quoteId: { type: string, format: uuid }
        version: { type: integer }
        expiresAt: { type: string, format: date-time }
        currency: { type: string, enum: [VND] }
        lines:
          type: array
          items:
            type: object
            properties:
              variantId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              unitPriceVnd: { type: [integer, 'null'] }
              lineTotalVnd: { type: [integer, 'null'] }
        shippingFeeVnd: { type: [integer, 'null'] }
        totalVnd: { type: [integer, 'null'] }
        canPlaceOrder: { type: boolean }
        blockers: { type: array, items: { $ref: '#/components/schemas/QuoteBlocker' } }
    CreateOrderRequest:
      type: object
      required: [checkoutQuoteId, acceptedQuoteVersion, paymentMethod]
      properties:
        checkoutQuoteId: { type: string, format: uuid }
        acceptedQuoteVersion: { type: integer }
        paymentMethod: { type: string, enum: [COD, BANK_TRANSFER] }
        guestContact: { type: [object, 'null'], description: only if GUEST_CHECKOUT_ENABLED }
    FactoryJobResponseDTO:
      type: object
      description: Strict allowlist. MUST NOT contain price, discount, total, payment, cost, margin, customer email.
      additionalProperties: false
      properties:
        jobCode: { type: string }
        orderRef: { type: string }
        status: { $ref: '#/components/schemas/FulfillmentStatus' }
        slaDueAt: { type: string, format: date-time }
        storageClass: { type: string, enum: [DRY, AMBIENT, CHILLED, FROZEN, FRAGILE] }
        items:
          type: array
          items:
            {
              type: object,
              additionalProperties: false,
              properties:
                {
                  sku: { type: string },
                  displayName: { type: string },
                  packLabel: { type: string },
                  quantity: { type: integer },
                  notes: { type: string },
                },
            }
        lotPicks:
          type: array
          items:
            {
              type: object,
              additionalProperties: false,
              properties:
                {
                  lotCode: { type: string },
                  expiresAt: { type: string, format: date },
                  quantity: { type: integer },
                },
            }
        shipLabel:
          {
            type: object,
            additionalProperties: false,
            properties:
              {
                receiverName: { type: string },
                phone: { type: string },
                addressLines: { type: array, items: { type: string } },
              },
          }
        packagingNotes: { type: string }
  responses:
    ValidationError:
      description: '400 VALIDATION_ERROR'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: '401'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: '403'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: '404 (also for out-of-scope resources)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: '409 state/idempotency/stock/price'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unprocessable:
      description: '422 business rule / blocker'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: '429 with Retry-After'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
